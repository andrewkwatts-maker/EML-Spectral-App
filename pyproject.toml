[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eml-spectral-app"
version = "2.0.36"
description = "KivyMD visual explorer for the eml-spectral PyPI library: Spectral flow Phi, Lorentz boosts, Clifford / Octonion / E7 / E8 algebras, named GR metrics, E8/Leech lattices, 167 spectral + math constants."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andrew K Watts", email = "andrewkwatts@gmail.com" }]
keywords = ["eml", "spectral", "physics", "kivy", "kivymd", "android", "visual",
            "g2", "clifford", "octonion", "e8", "schwarzschild", "lorentz",
            "spectral-flow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Education",
]

dependencies = [
    "kivy>=2.3,<3",
    "kivymd>=1.2,<2",
    "Pillow>=10",
    "eml-math>=2.0.36",
    "eml-spectral>=2.0.36",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "pyinstaller>=6.0",
    "buildozer>=1.5",
]

[project.urls]
Homepage = "https://github.com/andrewkwatts-maker/EML-Spectral-App"
Repository = "https://github.com/andrewkwatts-maker/EML-Spectral-App"
"EML-Spectral (PyPI)" = "https://pypi.org/project/eml-spectral/"

[project.scripts]
eml-spectral-app = "eml_spectral_app.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eml_spectral_app = [
    "kv/*.kv",
    "assets/*.png",
    "assets/*.svg",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
